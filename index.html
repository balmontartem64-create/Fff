
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amvora</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0c0e14;
    --text: #ffffff;
    --hint: #8b8b9e;
    --accent: #6366f1;
    --accent2: #8b5cf6;
    --card: #161923;
    --border: rgba(255, 255, 255, 0.05);
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--bg); position: sticky; top: 0; z-index: 50; }
  .logo { font-size: 22px; font-weight: 900; font-style: italic; letter-spacing: -1px; color: #fff; }
  .balance { display: flex; align-items: center; gap: 8px; background: var(--card); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 14px; }
  .balance-star { color: var(--gold); }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: var(--bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--hint); transition: 0.2s; flex: 1; cursor: pointer; font-weight: 600; }
  .nav-item.active { color: var(--text); }
  .nav-icon { font-size: 22px; }

  .screen { display: none; animation: fadeIn 0.3s ease; padding-bottom: 20px;}
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Сетка игр */
  .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px 20px; }
  .game-card { 
    background: var(--card); border-radius: 20px; overflow: hidden; position: relative; 
    height: 160px; cursor: pointer; border: 1px solid var(--border);
  }
  .game-card .bg-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: flex; justify-content: center; align-items: center; font-size: 70px; }
  .game-card .content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); z-index: 2; }
  .game-card h3 { margin: 0; font-size: 16px; font-weight: 800; }

  /* Сетка кейсов */
  .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 20px; }
  .case-item { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 10px; text-align: center; cursor: pointer; position: relative; }
  .case-item .img-container { width: 100%; height: 100px; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
  .case-item img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
  .case-item h4 { margin: 0 0 10px 0; font-size: 13px; font-weight: 700; color: #fff; }
  .case-price { display: inline-flex; justify-content: center; align-items: center; gap: 5px; font-weight: 800; color: #fff; background: var(--accent); padding: 6px 15px; border-radius: 15px; width: 100%; font-size: 14px; }

  /* Внутри кейса */
  .inside-case-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px 20px; }
  .inside-item { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 10px 5px; text-align: center; position: relative; display: flex; flex-direction: column; align-items: center; }
  .inside-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
  .inside-item .name { font-size: 10px; color: var(--hint); margin-bottom: 5px; line-height: 1.2; }
  .inside-item .price { font-size: 12px; font-weight: 800; color: var(--gold); }

  /* Игровые экраны */
  .game-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 150; padding: 20px; padding-bottom: 80px; overflow-y: auto; }
  .game-screen.active { display: block; }
  .game-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
  .back-btn { font-size: 28px; cursor: pointer; color: var(--text); }
  .game-title { font-size: 22px; font-weight: 800; margin: 0; }
  .bet-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; text-align: center; margin-bottom: 15px; }
  .result-text { text-align: center; font-size: 20px; font-weight: 800; margin-top: 15px; min-height: 28px; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 15px; padding: 15px; font-size: 16px; font-weight: 700; width: 100%; margin-bottom: 10px; cursor: pointer; }
  .btn.secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); }

  /* Авианосец */
  .carrier-area { position: relative; width: 100%; height: 200px; background: #0a1526; border-radius: 15px; overflow: hidden; margin-bottom: 20px; }
  .sea { position: absolute; bottom: 0; left: 0; width: 100%; height: 40px; background: linear-gradient(to top, #0f2d4a, #1e4b75); }
  .carrier-ship { position: absolute; right: -100px; bottom: 20px; font-size: 40px; transition: right 0.1s linear; z-index: 5; }
  .plane-icon { position: absolute; bottom: 40px; left: 20px; font-size: 30px; transition: bottom 0.1s linear, left 0.1s linear; z-index: 10; transform: scaleX(-1); }
  .multiplier { position: absolute; top: 15px; left: 15px; font-size: 24px; font-weight: 900; color: #fff; z-index: 20; }

  .cups-container { display: flex; justify-content: space-around; margin: 40px 0; }
  .cup { font-size: 60px; cursor: pointer; user-select: none; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">Amvora</div>
  <div class="balance"><span class="balance-star">⭐</span> <span id="headerBalance">100</span></div>
</div>

<!-- ВКЛАДКА ИГРЫ -->
<div id="screen-home" class="screen active">
  <div style="padding: 15px 20px 0; font-size: 24px; font-weight: 900; margin-bottom: 10px;">Игры</div>
  <div class="games-grid">
    <div class="game-card" onclick="openGame('carrier')">
      <div class="bg-img" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6);">✈️</div>
      <div class="content"><h3>Авианосец</h3></div>
    </div>
    <div class="game-card" onclick="openGame('roulette')">
      <div class="bg-img" style="background: linear-gradient(135deg, #7c3aed, #a855f7);">🎯</div>
      <div class="content"><h3>Рулетка</h3></div>
    </div>
    <div class="game-card" onclick="openGame('mines')">
      <div class="bg-img" style="background: linear-gradient(135deg, #1e1b4b, #312e81);">💣</div>
      <div class="content"><h3>Мины</h3></div>
    </div>
    <div class="game-card" onclick="openGame('cups')">
      <div class="bg-img" style="background: linear-gradient(135deg, #831843, #db2777);">🥤</div>
      <div class="content"><h3>Стаканчики</h3></div>
    </div>
  </div>
</div>

<!-- ВКЛАДКА КЕЙСЫ -->
<div id="screen-cases" class="screen">
  <div style="padding: 15px 20px 0; font-size: 24px; font-weight: 900; margin-bottom: 10px;">Кейсы</div>
  <div class="cases-grid">
    <div class="case-item" onclick="openCase('vice', 'Вайс-Сити', ['https://i.imgur.com/5yN9XqO.png', 'https://i.imgur.com/z8R4qJ8.png', 'https://i.imgur.com/3uX6qK2.png'])">
      <div class="img-container"><img src="https://i.imgur.com/5yN9XqO.png" alt="Case"></div>
      <h4>Вайс-Сити</h4>
      <div class="case-price">⭐ 80</div>
    </div>
    <div class="case-item" onclick="openCase('snoop', 'Snoop Dogg', ['https://i.imgur.com/z8R4qJ8.png', 'https://i.imgur.com/5yN9XqO.png', 'https://i.imgur.com/3uX6qK2.png'])">
      <div class="img-container"><img src="https://i.imgur.com/z8R4qJ8.png" alt="Case"></div>
      <h4>Snoop Dogg</h4>
      <div class="case-price">⭐ 230</div>
    </div>
    <div class="case-item" onclick="openCase('heart', 'Сердце', ['https://i.imgur.com/3uX6qK2.png', 'https://i.imgur.com/5yN9XqO.png', 'https://i.imgur.com/z8R4qJ8.png'])">
      <div class="img-container"><img src="https://i.imgur.com/3uX6qK2.png" alt="Case"></div>
      <h4>Сердце</h4>
      <div class="case-price">⭐ 460</div>
    </div>
    <div class="case-item" onclick="openCase('robbery', 'Ограбление', ['https://i.imgur.com/5yN9XqO.png', 'https://i.imgur.com/3uX6qK2.png', 'https://i.imgur.com/z8R4qJ8.png'])">
      <div class="img-container"><img src="https://i.imgur.com/3uX6qK2.png" alt="Case"></div>
      <h4>Ограбление</h4>
      <div class="case-price">⭐ 190</div>
    </div>
  </div>
</div>

<!-- ЭКРАН ВНУТРИ КЕЙСА -->
<div id="screen-inside-case" class="screen">
  <div class="game-header"><div class="back-btn" onclick="switchTab('screen-cases', document.querySelectorAll('.nav-item')[1])">←</div><h2 class="game-title" id="caseTitle">Кейс</h2></div>
  <div class="inside-case-grid" id="insideCaseGrid"></div>
  <button class="btn" id="openCaseBtn" style="margin-top: 20px;" onclick="tg.showAlert('Оплата Stars через сервер.')">Открыть кейс</button>
</div>

<!-- ИГРЫ -->
<div id="game-carrier" class="game-screen">
  <div class="game-header"><div class="back-btn" onclick="closeGame()">←</div><h2 class="game-title">Авианосец</h2></div>
  <div class="carrier-area">
    <div class="sea"></div>
    <div class="multiplier" id="carrierMult">x1.0</div>
    <div class="carrier-ship" id="carrierShip">🛳️</div>
    <div class="plane-icon" id="carrierPlane">✈️</div>
  </div>
  <div class="bet-input"><input type="text" id="betCarrier" placeholder="Ставка" value="10" style="width:100%; border:none; background:transparent; color:var(--text); outline:none;"></div>
  <button class="btn" onclick="startCarrier()" id="btnStartCarrier">Взлет</button>
  <button class="btn" onclick="landCarrier()" id="btnLandCarrier" style="display: none; background: #10b981;">Приземлиться</button>
  <div class="result-text" id="resCarrier"></div>
</div>

<div id="game-roulette" class="game-screen">
  <div class="game-header"><div class="back-btn" onclick="closeGame()">←</div><h2 class="game-title">Рулетка</h2></div>
  <div style="text-align:center; font-size:80px; margin:20px 0;">🎯</div>
  <div class="bet-input"><input type="text" id="betRoulette" placeholder="Ставка" value="10" style="width:100%; border:none; background:transparent; color:var(--text); outline:none;"></div>
  <button class="btn" onclick="spinRoulette()" id="btnRoulette">Крутить</button>
  <div class="result-text" id="resRoulette"></div>
</div>

<div id="game-mines" class="game-screen">
  <div class="game-header"><div class="back-btn" onclick="closeGame()">←</div><h2 class="game-title">Мины</h2></div>
  <div class="mines-grid" id="minesGrid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px auto; max-width: 300px;"></div>
  <div class="bet-input"><input type="text" id="betMines" placeholder="Ставка" value="10" style="width:100%; border:none; background:transparent; color:var(--text); outline:none;"></div>
  <button class="btn" onclick="startMines()" id="btnStartMines">Начать</button>
  <button class="btn secondary" onclick="cashoutMines()" id="btnCashoutMines" style="display: none;">Забрать</button>
  <div class="result-text" id="resMines"></div>
</div>

<div id="game-cups" class="game-screen">
  <div class="game-header"><div class="back-btn" onclick="closeGame()">←</div><h2 class="game-title">Стаканчики</h2></div>
  <div class="cups-container" id="cupsContainer">
    <div class="cup" onclick="pickCup(0)">🥤</div>
    <div class="cup" onclick="pickCup(1)">🥤</div>
    <div class="cup" onclick="pickCup(2)">🥤</div>
  </div>
  <div class="bet-input"><input type="text" id="betCups" placeholder="Ставка" value="10" style="width:100%; border:none; background:transparent; color:var(--text); outline:none;"></div>
  <button class="btn" onclick="startCups()" id="btnStartCups">Перемешать</button>
  <div class="result-text" id="resCups"></div>
</div>

<!-- НИЖНЕЕ МЕНЮ -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('screen-home', this)"><div class="nav-icon">🎮</div>Игры</div>
  <div class="nav-item" onclick="switchTab('screen-cases', this)"><div class="nav-icon">🎁</div>Кейсы</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const u = tg.initDataUnsafe?.user || { id: 0 };
let db = JSON.parse(localStorage.getItem('amvora_db')) || {};
if (!db[u.id]) db[u.id] = { stars: 100 };
document.getElementById('headerBalance').innerText = db[u.id].stars;

function updateBalanceUI() {
  document.getElementById('headerBalance').innerText = db[u.id].stars;
  localStorage.setItem('amvora_db', JSON.stringify(db));
}

function switchTab(screenId, navElement) { 
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
  document.getElementById(screenId).classList.add('active'); 
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); 
  if (navElement) navElement.classList.add('active'); 
  document.querySelectorAll('.game-screen').forEach(g => g.classList.remove('active'));
}
function openGame(gameId) { document.getElementById('game-' + gameId).classList.add('active'); }
function closeGame() { document.querySelectorAll('.game-screen').forEach(g => g.classList.remove('active')); }

// КЕЙСЫ
function openCase(id, title, items) {
  document.getElementById('caseTitle').innerText = title;
  const grid = document.getElementById('insideCaseGrid');
  grid.innerHTML = '';
  
  // Названия и цены для предметов (просто для визуала)
  const names = ['Snoop Dogg', 'Heart', 'Bear', 'Cake', 'Diamond', 'Champagne', 'Ring', 'Rose'];
  const prices = [5000, 1200, 800, 500, 1500, 300, 2500, 100];
  
  items.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'inside-item';
    div.innerHTML = `
      <img src="${img}" alt="item">
      <div class="name">${names[i % names.length]}</div>
      <div class="price">⭐ ${prices[i % prices.length]}</div>
    `;
    grid.appendChild(div);
  });
  
  switchTab('screen-inside-case', document.querySelectorAll('.nav-item')[1]);
}

// АВИАНОСЕЦ
let carrierActive = false, carrierInt, carrierBet = 0, carrierMultVal = 1.0;
function startCarrier() {
  if (carrierActive) return;
  const bet = parseInt(document.getElementById('betCarrier').value);
  if (isNaN(bet) || bet <= 0 || bet > db[u.id].stars) { tg.showAlert('Неверная ставка'); return; }
  
  db[u.id].stars -= bet; updateBalanceUI();
  carrierActive = true; carrierBet = bet; carrierMultVal = 1.0;
  document.getElementById('btnStartCarrier').style.display = 'none'; document.getElementById('btnLandCarrier').style.display = 'block';
  document.getElementById('resCarrier').innerText = '';
  
  const plane = document.getElementById('carrierPlane'); const ship = document.getElementById('carrierShip'); const mult = document.getElementById('carrierMult');
  plane.style.left = '20px'; plane.style.bottom = '40px'; ship.style.right = '-100px'; ship.innerText = '🛳️'; plane.innerText = '✈️';
  
  carrierInt = setInterval(() => {
    carrierMultVal += 0.1;
    mult.innerText = `x${carrierMultVal.toFixed(1)}`;
    let left = parseFloat(plane.style.left) || 20;
    let bottom = parseFloat(plane.style.bottom) || 40;
    plane.style.left = (left + 2) + 'px';
    plane.style.bottom = (bottom + 1) + 'px';
    
    if (carrierMultVal > 1.5 && ship.style.right === '-100px' && Math.random() < 0.05) {
      ship.style.right = Math.floor(Math.random() * 150 + 50) + 'px'; 
    }
    if (parseFloat(plane.style.left) > 320) {
      clearInterval(carrierInt); carrierActive = false;
      document.getElementById('btnStartCarrier').style.display = 'block'; document.getElementById('btnLandCarrier').style.display = 'none';
      document.getElementById('resCarrier').innerText = `Самолет упал в море! Проигрыш -${carrierBet} ⭐`;
      document.getElementById('resCarrier').style.color = '#ef4444';
    }
  }, 100);
}

function landCarrier() {
  if (!carrierActive) return;
  clearInterval(carrierInt);
  carrierActive = false;
  const plane = document.getElementById('carrierPlane'); const ship = document.getElementById('carrierShip');
  const planeLeft = parseFloat(plane.style.left); const shipRight = parseFloat(ship.style.right);
  
  if (shipRight !== -100 && planeLeft >= (320 - shipRight - 60) && planeLeft <= (320 - shipRight)) {
    const win = Math.floor(carrierBet * carrierMultVal);
    db[u.id].stars += win; updateBalanceUI();
    plane.innerText = '🛬'; ship.innerText = '🛳️✅';
    document.getElementById('resCarrier').innerText = `Успешная посадка! Выигрыш +${win} ⭐`;
    document.getElementById('resCarrier').style.color = '#10b981';
  } else {
    plane.innerText = '💥';
    document.getElementById('resCarrier').innerText = `Вы промахнулись мимо полосы! Проигрыш -${carrierBet} ⭐`;
    document.getElementById('resCarrier').style.color = '#ef4444';
  }
  document.getElementById('btnStartCarrier').style.display = 'block'; document.getElementById('btnLandCarrier').style.display = 'none';
}

// РУЛЕТКА
function spinRoulette() {
  const bet = parseInt(document.getElementById('betRoulette').value);
  if (isNaN(bet) || bet > db[u.id].stars) return;
  db[u.id].stars -= bet; updateBalanceUI();
  const win = Math.random() < 0.4; const mult = win ? 2 : 0;
  setTimeout(() => {
    if (win) { db[u.id].stars += bet * mult; updateBalanceUI(); document.getElementById('resRoulette').innerText = `Выигрыш +${bet*mult} ⭐`; document.getElementById('resRoulette').style.color = '#10b981'; }
    else { document.getElementById('resRoulette').innerText = `Проигрыш -${bet} ⭐`; document.getElementById('resRoulette').style.color = '#ef4444'; }
  }, 1000);
}

// МИНЫ
let minesActive = false, minesBet = 0, minesMines = [], minesMult = 1;
function startMines() {
  if (minesActive) return;
  const bet = parseInt(document.getElementById('betMines').value);
  if (isNaN(bet) || bet > db[u.id].stars) return;
  db[u.id].stars -= bet; updateBalanceUI();
  minesActive = true; minesBet = bet; minesMult = 1; minesMines = [];
  document.getElementById('btnStartMines').style.display = 'none'; document.getElementById('btnCashoutMines').style.display = 'block';
  for (let i = 0; i < 4; i++) { let idx = Math.floor(Math.random() * 25); while(minesMines.includes(idx)) idx = Math.floor(Math.random() * 25); minesMines.push(idx); }
  const grid = document.getElementById('minesGrid'); grid.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const cell = document.createElement('div'); cell.style.cssText = 'aspect-ratio:1; background:#161923; border:1px solid rgba(255,255,255,0.1); border-radius:10px; display:flex; justify-content:center; align-items:center; cursor:pointer;';
    cell.onclick = () => {
      if (!minesActive || cell.innerHTML !== '') return;
      if (minesMines.includes(i)) { cell.innerHTML = '💥'; cell.style.background = '#ef4444'; minesActive = false; document.getElementById('btnStartMines').style.display = 'block'; document.getElementById('btnCashoutMines').style.display = 'none'; document.getElementById('resMines').innerText = `Проигрыш -${minesBet} ⭐`; document.getElementById('resMines').style.color = '#ef4444'; }
      else { cell.innerHTML = '💎'; cell.style.background = '#10b981'; minesMult += 0.2; document.getElementById('resMines').innerText = `Текущий выигрыш: ${Math.floor(minesBet * minesMult)} ⭐`; document.getElementById('resMines').style.color = '#10b981'; }
    };
    grid.appendChild(cell);
  }
}
function cashoutMines() {
  if (!minesActive) return;
  const win = Math.floor(minesBet * minesMult); db[u.id].stars += win; updateBalanceUI(); minesActive = false;
  document.getElementById('btnStartMines').style.display = 'block'; document.getElementById('btnCashoutMines').style.display = 'none';
  document.getElementById('resMines').innerText = `Забрано +${win} ⭐`; document.getElementById('resMines').style.color = '#10b981';
}

// СТАКАНЧИКИ
let cupsActive = false, ballCup = -1;
function startCups() {
  if (cupsActive) return;
  const bet = parseInt(document.getElementById('betCups').value);
  if (isNaN(bet) || bet > db[u.id].stars) return;
  db[u.id].stars -= bet; updateBalanceUI(); cupsActive = true; ballCup = Math.floor(Math.random() * 3);
  const cups = document.getElementById('cupsContainer').children;
  for (let i=0; i<3; i++) { cups[i].innerText = '🥤'; cups[i].style.pointerEvents = 'none'; }
  let count = 0;
  const int = setInterval(() => {
    const a = Math.floor(Math.random() * 3), b = Math.floor(Math.random() * 3);
    cups[a].style.transform = 'translateY(-20px)'; cups[b].style.transform = 'translateY(-20px)';
    setTimeout(() => { cups[a].style.transform = 'none'; cups[b].style.transform = 'none'; }, 150);
    count++;
    if (count > 5) { clearInterval(int); for (let i=0; i<3; i++) cups[i].style.pointerEvents = 'auto'; }
  }, 300);
}
function pickCup(index) {
  if (!cupsActive) return;
  cupsActive = false;
  const bet = parseInt(document.getElementById('betCups').value);
  const cups = document.getElementById('cupsContainer').children;
  if (index === ballCup) { cups[index].innerText = '⚪'; db[u.id].stars += bet * 3; updateBalanceUI(); document.getElementById('resCups').innerText = `Победа! +${bet*3} ⭐`; document.getElementById('resCups').style.color = '#10b981'; }
  else { cups[index].innerText = '❌'; cups[ballCup].innerText = '⚪'; document.getElementById('resCups').innerText = `Проигрыш -${bet} ⭐`; document.getElementById('resCups').style.color = '#ef4444'; }
}
</script>
</body>
</html>
